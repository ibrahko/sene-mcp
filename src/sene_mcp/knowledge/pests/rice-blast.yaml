id: rice-blast
crops: [rice]
names:
  fr: Pyriculariose du riz
  bm: null  # added only after review by a Bambara speaker
  scientific: Pyricularia oryzae
kind: disease
symptoms:
  - taches en forme de losange sur les feuilles, au centre gris et au bord brun
  - col de la panicule noirci et pourri (pourriture du cou)
  - panicules blanchies avec des grains vides
  - tiges qui cassent au niveau des nœuds
keywords: [losange, taches grises, cou pourri, panicule blanche, grains vides, pyriculariose]
season: Toute la campagne ; favorisée par l'humidité et un excès d'engrais azoté
severity: high
management:
  prevention:
    - Utiliser les variétés résistantes recommandées localement (par exemple certaines variétés NERICA)
    - Semer tôt pour éviter les conditions les plus favorables à la maladie
  cultural:
    - Bien gérer l'eau et maintenir l'inondation des rizières quand c'est possible
    - Éviter l'excès d'engrais azoté dans les zones où la maladie est fréquente
  biological: []
treatment_guidance: >
  Pour tout traitement, contactez le service agricole ou l'agent de vulgarisation
  de votre zone.
sources:
  - title: Rice (Revised)
    publisher: Infonet-Biovision
    url: https://infonet-biovision.org/crops-fruits-vegetables/rice-revised
    consulted_on: 2026-09-25
review_status: sourced
