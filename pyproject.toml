[project]
name = "sene-mcp"
version = "0.1.0.dev0"
description = "MCP server giving AI agents safe, sourced tools for Malian farming cooperatives: pest guidance and crop market data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ibrahima Koné" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.11.12",
]

[project.scripts]
sene-mcp = "sene_mcp.server:main"
sene-mcp-seed = "sene_mcp.seed:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sene_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sene_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*", "mcp_types.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
